services:
  - type: web
    name: instagram-post-generator
    env: python
    region: oregon
    plan: free
    branch: claude/instagram-post-generator-gT38p
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn main_web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
